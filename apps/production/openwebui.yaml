---
apiVersion: v1
kind: Namespace
metadata:
  name: openwebui
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openwebui
  namespace: openwebui
  labels:
    app: openwebui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openwebui
  template:
    metadata:
      labels:
        app: openwebui
    spec:
      containers:
      - name: openwebui
        image: ghcr.io/open-webui/open-webui:main
        ports:
        - containerPort: 8080
        env:
        - name: WEBUI_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: openwebui-runtime-secret
              key: WEBUI_SECRET_KEY
        - name: STORAGE_PROVIDER
          value: "s3"
        - name: ENABLE_S3
          value: "true"
        - name: ENABLE_RAG_WEB_LOADER
          value: "true"
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: openwebui-s3-credentials
              key: S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: openwebui-s3-credentials
              key: S3_SECRET_ACCESS_KEY
        - name: S3_ENDPOINT_URL
          valueFrom:
            secretKeyRef:
              name: openwebui-s3-credentials
              key: S3_ENDPOINT_URL
        - name: S3_BUCKET_NAME
          valueFrom:
            secretKeyRef:
              name: openwebui-s3-credentials
              key: S3_BUCKET_NAME
        - name: S3_REGION_NAME
          valueFrom:
            secretKeyRef:
              name: openwebui-s3-credentials
              key: S3_REGION_NAME
        - name: UPLOAD_DIR
          value: "/app/backend/data/uploads"
        - name: DATA_DIR
          value: "/app/backend/data"
        volumeMounts:
        - name: data
          mountPath: /app/backend/data
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: openwebui
  namespace: openwebui
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
  selector:
    app: openwebui
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openwebui-tls
  namespace: openwebui
spec:
  secretName: openwebui-tls
  issuerRef:
    name: ca-issuer
    kind: ClusterIssuer
  dnsNames:
  - openwebui.k8s.lan
  - chat.k8s.lan
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: openwebui
  namespace: openwebui
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - openwebui.k8s.lan
    - chat.k8s.lan
    secretName: openwebui-tls
  rules:
  - host: openwebui.k8s.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openwebui
            port:
              number: 8080
  - host: chat.k8s.lan
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: openwebui
            port:
              number: 8080
