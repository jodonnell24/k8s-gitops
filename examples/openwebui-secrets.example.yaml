---
# Example only. Do not commit live Secret manifests.
# In a real cluster, create these as SealedSecrets or through an external
# secret manager before applying apps/production/openwebui.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-runtime-secret
  namespace: openwebui
type: Opaque
stringData:
  WEBUI_SECRET_KEY: replace-with-generated-value
---
apiVersion: v1
kind: Secret
metadata:
  name: openwebui-s3-credentials
  namespace: openwebui
type: Opaque
stringData:
  S3_ACCESS_KEY_ID: replace-with-access-key-id
  S3_SECRET_ACCESS_KEY: replace-with-secret-access-key
  S3_ENDPOINT_URL: https://s3.example.com
  S3_BUCKET_NAME: openwebui-data
  S3_REGION_NAME: us-east-1
