---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: flux-system
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '>=65.0.0 <66.0.0'
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  targetNamespace: monitoring
  install:
    crds: Create
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Grafana configuration
    grafana:
      enabled: true
      admin:
        existingSecret: grafana-admin-credentials
        userKey: admin-user
        passwordKey: admin-password
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - grafana.k8s.lan
        tls:
          - secretName: grafana-tls
            hosts:
              - grafana.k8s.lan
      # Disable persistence for homelab (data stored in pod, lost on restart)
      persistence:
        enabled: false
    
    # Prometheus configuration
    prometheus:
      enabled: true
      prometheusSpec:
        retention: 7d
        # Disable persistence for homelab
        storageSpec: {}
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 2Gi
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - prometheus.k8s.lan
        tls:
          - secretName: prometheus-tls
            hosts:
              - prometheus.k8s.lan
    
    # AlertManager configuration
    alertmanager:
      enabled: true
      # Disable persistence for homelab
      alertmanagerSpec:
        storage: {}
      ingress:
        enabled: true
        ingressClassName: nginx
        annotations:
          nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
        hosts:
          - alertmanager.k8s.lan
        tls:
          - secretName: alertmanager-tls
            hosts:
              - alertmanager.k8s.lan
    
    # Node exporter (collects node metrics)
    nodeExporter:
      enabled: true
    
    # Kube-state-metrics (collects k8s object metrics)
    kubeStateMetrics:
      enabled: true
    
    # Disable some heavyweight components for homelab
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
