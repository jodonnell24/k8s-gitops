---
apiVersion: v1
kind: Namespace
metadata:
  name: dns
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: dns
data:
  Corefile: |
    k8s.lan:53 {
        errors
        log
        hosts {
            10.69.69.3 grafana.k8s.lan
            10.69.69.3 prometheus.k8s.lan
            10.69.69.3 alertmanager.k8s.lan
            10.69.69.3 2048.k8s.lan
            10.69.69.3 play.k8s.lan
            10.69.69.3 whoami.k8s.lan
            10.69.69.3 openwebui.k8s.lan
            10.69.69.3 chat.k8s.lan
            fallthrough
        }
        forward . /etc/resolv.conf
    }
    .:53 {
        errors
        health {
            lameduck 5s
        }
        ready
        forward . /etc/resolv.conf
        cache 30
        loop
        reload
        loadbalance
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: coredns-custom
  namespace: dns
spec:
  replicas: 1
  selector:
    matchLabels:
      app: coredns-custom
  template:
    metadata:
      labels:
        app: coredns-custom
    spec:
      containers:
      - name: coredns
        image: coredns/coredns:latest
        args:
        - -conf
        - /etc/coredns/Corefile
        volumeMounts:
        - name: config
          mountPath: /etc/coredns
          readOnly: true
        ports:
        - containerPort: 53
          protocol: UDP
          name: dns-udp
        - containerPort: 53
          protocol: TCP
          name: dns-tcp
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
      volumes:
      - name: config
        configMap:
          name: coredns-custom
---
apiVersion: v1
kind: Service
metadata:
  name: coredns-custom
  namespace: dns
spec:
  type: LoadBalancer
  ports:
  - port: 53
    targetPort: 53
    protocol: UDP
    name: dns-udp
  - port: 53
    targetPort: 53
    protocol: TCP
    name: dns-tcp
  selector:
    app: coredns-custom
